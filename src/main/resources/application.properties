# Datasource Configuration (PostgreSQL Neon / Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:${PG_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:pulsetrack}?sslmode=${POSTGRES_SSLMODE:disable}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PG_USER:${POSTGRES_USER:postgres}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PG_PASSWORD:${POSTGRES_PASSWORD:postgrespassword}}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:${JPA_DDL_AUTO:update}}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Configuration
spring.data.redis.host=${SPRING_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_REDIS_PORT:${REDIS_PORT:6379}}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:${REDIS_PASSWORD:}}
spring.data.redis.ssl.enabled=${SPRING_REDIS_SSL:${REDIS_SSL:false}}

# Server & Lifecycle
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.port=${PORT:8080}

# Actuator & Security
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}